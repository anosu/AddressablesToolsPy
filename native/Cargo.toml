[package]
name = "addressablestools"
version = "1.1.0"
publish = false
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Native catalog parsers for addressablestools"

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py312"] }

[profile.release]
lto = "thin"
codegen-units = 1
