[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "addressablestools-rust"
version = "0.3.1"
description = "Optional Rust acceleration for addressablestools catalogs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["addressablestools>=1.0.0,<2"]

[tool.maturin]
module-name = "_addressablestools_rust"
