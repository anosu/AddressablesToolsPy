[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "addressablestools"
version = "1.0.0"
authors = [{ name = "Jitsu", email = "jitsu233@gmail.com" }]
description = "Python library for reading Unity Addressables catalog files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
native = ["addressablestools-rust>=0.3.1,<0.4"]

[tool.uv.sources]
addressablestools-rust = { path = "native" }

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["AddressablesTools"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["addressablestools*"]

[tool.setuptools.package-data]
addressablestools = ["py.typed"]

[project.urls]
"Homepage" = "https://github.com/anosu/AddressablesToolsPy"
"Bug Reports" = "https://github.com/anosu/AddressablesToolsPy/issues"
"Changelog" = "https://github.com/anosu/AddressablesToolsPy/blob/main/CHANGELOG.md"
"Funding" = "https://donate.pypi.org"
"Source" = "https://github.com/anosu/AddressablesToolsPy"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.3.5",
    "ruff>=0.11.7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/addressablestools", "src/AddressablesTools.py"]
