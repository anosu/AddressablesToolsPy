[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "addressablestools"
version = "1.1.1"
authors = [{ name = "Jitsu", email = "jitsu233@gmail.com" }]
description = "Python library for reading Unity Addressables catalog files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Compatibility alias; the native module is included in every wheel.
native = []

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "addressablestools._rust"
include = [
    { path = "AddressablesTools.py", format = ["sdist", "wheel"] },
    { path = "CHANGELOG.md", format = "sdist" },
    { path = "PUBLISHING.md", format = "sdist" },
    { path = "tests/*.py", format = "sdist" },
    { path = "tests/samples/*", format = "sdist" },
    { path = "benchmarks/*.py", format = "sdist" },
    { path = "benchmarks/*.md", format = "sdist" },
    { path = ".github/workflows/*.yml", format = "sdist" },
    { path = ".gitignore", format = "sdist" },
    { path = "uv.lock", format = "sdist" },
]

[project.urls]
"Homepage" = "https://github.com/anosu/AddressablesToolsPy"
"Bug Reports" = "https://github.com/anosu/AddressablesToolsPy/issues"
"Changelog" = "https://github.com/anosu/AddressablesToolsPy/blob/main/CHANGELOG.md"
"Funding" = "https://donate.pypi.org"
"Source" = "https://github.com/anosu/AddressablesToolsPy"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.3.5",
    "ruff>=0.11.7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/addressablestools", "src/AddressablesTools.py"]
