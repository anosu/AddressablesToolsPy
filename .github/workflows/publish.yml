name: Publish package to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require the tag to match the package version
        shell: bash
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match $package_version." >&2
            exit 1
          fi

  build:
    name: Build and test release distributions
    needs: verify-tag
    uses: ./.github/workflows/native.yml

  publish:
    name: Publish verified distributions to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/addressablestools
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: addressablestools-distributions
          path: dist/
      - name: Publish distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
